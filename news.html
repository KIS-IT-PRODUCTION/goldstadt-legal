<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goldstadtaktuell</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
        }
        .container { padding: 20px; }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #B8860B;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h1 { font-size: 20px; margin-bottom: 10px; color: #B8860B; }
        p { font-size: 14px; color: #aaaaaa; }
    </style>
</head>
<body>

<div class="container">
    <div class="spinner"></div>
    <h1>Wird geladen...</h1>
    <p>Beitrag wird in der Goldstadtaktuell App geöffnet.</p>
</div>

<script>
    // 1. Отримуємо ID новини з URL-адреси
    const urlParams = new URLSearchParams(window.location.search);
    const newsId = urlParams.get('id');

    // 2. Наші посилання (Заміни своїми реальними ID з маркетів, коли вони будуть)
    const appCustomScheme = `goldstadtaktuell://news/${newsId}`;
    const appStoreUrl = "https://apps.apple.com/app/id1610112917"; 
    const googlePlayUrl = "https://play.google.com/store/apps/details?id=com.kisit.goldstadtaktuell";

    // 3. Спроба відкрити додаток напряму
    if (newsId) {
        window.location.href = appCustomScheme;
    } else {
        // Якщо ID немає, ведемо на головну сторінку маркету або сайту
        window.location.href = "https://play.google.com/store/apps/details?id=de.goldstadtaktuell.app";
    }

    // 4. Якщо додаток НЕ встановлено, спрацює таймер і перекине в маркет
    setTimeout(() => {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
        const isAndroid = /Android/.test(userAgent);

        if (isIOS) {
            window.location.href = appStoreUrl;
        } else if (isAndroid) {
            window.location.href = googlePlayUrl;
        } else {
            // Якщо відкрили з комп'ютера (ПК)
            window.location.href = "https://kis-it-production.github.io/goldstadt-legal";
        }
    }, 2000); // 2 секунди затримки
</script>

</body>
</html>
